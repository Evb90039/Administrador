<div class="paginator">
  <div class="pg-info">
    <span>Mostrar</span>
    <select
      class="form-select form-select-sm pg-size"
      aria-label="Filas por página"
      [value]="pageSize()"
      (change)="changeSize($any($event.target).value)"
    >
      @for (s of pageSizes(); track s) {
        <option [value]="s" [selected]="s === pageSize()">{{ s }}</option>
      }
    </select>
    <span class="d-none d-sm-inline">· {{ from() }}–{{ to() }} de {{ total() }}</span>
  </div>

  <nav class="pg-nav" aria-label="Paginación">
    <button type="button" class="pg-btn" [disabled]="current() === 1" (click)="goTo(current() - 1)" aria-label="Página anterior">
      <i class="bi bi-chevron-left"></i>
    </button>

    @for (p of pages(); track $index) {
      @if (p === null) {
        <span class="pg-dots">…</span>
      } @else {
        <button
          type="button"
          class="pg-btn"
          [class.active]="p === current()"
          [attr.aria-current]="p === current() ? 'page' : null"
          (click)="goTo(p)"
        >
          {{ p }}
        </button>
      }
    }

    <button
      type="button"
      class="pg-btn"
      [disabled]="current() === totalPages()"
      (click)="goTo(current() + 1)"
      aria-label="Página siguiente"
    >
      <i class="bi bi-chevron-right"></i>
    </button>
  </nav>
</div>
