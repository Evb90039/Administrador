<div class="mb-4">
  <h2 class="mb-1 fw-semibold">Ajustes</h2>
  <p class="text-muted small mb-0">Configura tus preferencias</p>
</div>

<div class="row g-3">
  <div class="col-12 col-lg-8">
    <div class="card">
      <div class="card-body">
        <h5 class="mb-4">General</h5>
        <form>
          <div class="mb-3">
            <label class="form-label small fw-medium">Nombre del sitio</label>
            <input type="text" class="form-control" value="Administrador" />
          </div>
          <div class="mb-3">
            <label class="form-label small fw-medium">Correo de contacto</label>
            <input type="email" class="form-control" placeholder="correo@ejemplo.com" />
          </div>

          <hr class="my-4" />

          <h6 class="mb-3">Preferencias</h6>
          <div class="setting-row">
            <div>
              <div class="fw-medium">Notificaciones por correo</div>
              <small class="text-muted">Recibe alertas importantes</small>
            </div>
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="notifSwitch" checked />
            </div>
          </div>
          <div class="setting-row">
            <div>
              <div class="fw-medium">Modo oscuro</div>
              <small class="text-muted">Interfaz con tema oscuro</small>
            </div>
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="darkSwitch" />
            </div>
          </div>
          <div class="setting-row">
            <div>
              <div class="fw-medium">Compactar vistas</div>
              <small class="text-muted">Reduce el espaciado</small>
            </div>
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="compactSwitch" />
            </div>
          </div>

          <button type="button" class="btn btn-primary mt-4"><i class="bi bi-check2 me-1"></i> Guardar cambios</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-12 col-lg-4">
    <div class="card card-hover">
      <div class="card-body text-center">
        <div class="avatar-xl mx-auto mb-3">EV</div>
        <h5 class="mb-1">Enrique Vizcarra</h5>
        <p class="text-muted small mb-3">enrique&#64;ejemplo.com</p>
        <button class="btn btn-light w-100"><i class="bi bi-pencil me-1"></i> Editar perfil</button>
      </div>
    </div>
  </div>
</div>
