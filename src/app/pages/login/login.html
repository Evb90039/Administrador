<div class="login-wrapper">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="login-card page-anim">
    <div class="text-center mb-4">
      <div class="login-logo">
        <i class="bi bi-hexagon-fill"></i>
      </div>
      <h3 class="mt-3 mb-1">Bienvenido</h3>
      <p class="text-muted small mb-0">Inicia sesión para continuar</p>
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger py-2 small" role="alert">
        <i class="bi bi-exclamation-circle me-1"></i>{{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label small fw-500">Correo</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
          <input
            type="email"
            class="form-control"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-500">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
          <input
            type="password"
            class="form-control"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner-border spinner-border-sm me-1"></span> Ingresando…
        } @else {
          Iniciar sesión <i class="bi bi-arrow-right ms-1"></i>
        }
      </button>
    </form>
  </div>
</div>
