<div class="d-flex justify-content-between align-items-end mb-4 gap-3 flex-wrap">
  <div>
    <h2 class="mb-1 fw-semibold">Reportes</h2>
    <p class="text-muted small mb-0">Analítica y descargas</p>
  </div>
  <div class="btn-group">
    <button class="btn btn-light"><i class="bi bi-funnel me-1"></i> Filtrar</button>
    <button class="btn btn-primary"><i class="bi bi-download me-1"></i> Exportar</button>
  </div>
</div>

<div class="row g-3">
  <div class="col-12 col-lg-6">
    <div class="card card-hover">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Ventas mensuales</h5>
          <span class="badge rounded-pill text-bg-primary-soft">Últimos 30 días</span>
        </div>
        <div class="chart-placeholder">
          <i class="bi bi-bar-chart-line"></i>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="card card-hover">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Usuarios activos</h5>
          <span class="badge rounded-pill text-bg-success-soft">+12%</span>
        </div>
        <div class="chart-placeholder chart-placeholder--success">
          <i class="bi bi-pie-chart"></i>
        </div>
      </div>
    </div>
  </div>
</div>
