<div class="page-header">
  <div>
    <h2 class="page-title">Dashboard</h2>
    <p class="page-subtitle">Resumen general de tu actividad</p>
  </div>
  <button class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Nuevo</button>
</div>

<div class="row g-3 mb-4">
  <div class="col-12 col-md-6 col-xl-3">
    <div class="card card-hover stat-card">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon stat-icon--primary"><i class="bi bi-people"></i></div>
        <div>
          <p class="stat-label">Usuarios</p>
          <h3 class="stat-value">1,250</h3>
          <small class="text-success"><i class="bi bi-arrow-up-right"></i> 12.5%</small>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-6 col-xl-3">
    <div class="card card-hover stat-card">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon stat-icon--success"><i class="bi bi-cart"></i></div>
        <div>
          <p class="stat-label">Ventas</p>
          <h3 class="stat-value">340</h3>
          <small class="text-success"><i class="bi bi-arrow-up-right"></i> 8.2%</small>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-6 col-xl-3">
    <div class="card card-hover stat-card">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon stat-icon--warning"><i class="bi bi-exclamation-triangle"></i></div>
        <div>
          <p class="stat-label">Alertas</p>
          <h3 class="stat-value">7</h3>
          <small class="text-danger"><i class="bi bi-arrow-down-right"></i> 3.1%</small>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-md-6 col-xl-3">
    <div class="card card-hover stat-card">
      <div class="card-body d-flex align-items-center gap-3">
        <div class="stat-icon stat-icon--info"><i class="bi bi-graph-up"></i></div>
        <div>
          <p class="stat-label">Reportes</p>
          <h3 class="stat-value">15</h3>
          <small class="text-success"><i class="bi bi-arrow-up-right"></i> 5.6%</small>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-12 col-lg-8">
    <div class="card">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">Actividad reciente</h5>
          <a href="#" class="small text-decoration-none">Ver todo</a>
        </div>
        <div class="activity-chart">
          <i class="bi bi-bar-chart-line display-3 text-muted opacity-25"></i>
          <p class="text-muted mt-2 mb-0 small">Aquí irá tu gráfica</p>
        </div>
      </div>
    </div>
  </div>
  <div class="col-12 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h5 class="mb-3">Accesos rápidos</h5>
        <div class="quick-list">
          <a class="quick-item">
            <span class="quick-icon stat-icon--primary"><i class="bi bi-plus-circle"></i></span>
            <span>Nuevo usuario</span>
            <i class="bi bi-chevron-right ms-auto text-muted"></i>
          </a>
          <a class="quick-item">
            <span class="quick-icon stat-icon--success"><i class="bi bi-box-seam"></i></span>
            <span>Nuevo producto</span>
            <i class="bi bi-chevron-right ms-auto text-muted"></i>
          </a>
          <a class="quick-item">
            <span class="quick-icon stat-icon--info"><i class="bi bi-file-earmark-text"></i></span>
            <span>Generar reporte</span>
            <i class="bi bi-chevron-right ms-auto text-muted"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
